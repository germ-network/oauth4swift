name: Workflows

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Check only, so read access is all it needs.
permissions:
  contents: read

jobs:
  pinact:
    name: Actions pinned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify every action is SHA-pinned with a truthful version comment
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          # Report, don't rewrite. A fix belongs in a reviewed commit, not in CI.
          fix: false
          # A version comment written by hand, or by an attacker, doesn't have
          # to name the version its SHA actually is. This checks that it does.
          verify: true
          # Give a compromised release time to be spotted before it can run here, in days.
          min_age: 1
